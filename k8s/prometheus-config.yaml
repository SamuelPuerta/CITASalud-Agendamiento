apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'citas-backend'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['citas-backend-service:8080']
